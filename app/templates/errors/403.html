{% extends "base.html" %}
{% block title %}403 - Access Denied | CaseBridge{% endblock %}
{% block content %}
<div class="card container-sm" style="text-align: center; margin: 3rem auto; padding: 3rem 2rem;">
  <span style="font-family: var(--cb-font-mono); font-size: 0.85rem; font-weight: 700; color: var(--cb-red-text);">ERROR 403</span>
  <h1 style="font-size: 1.75rem; color: var(--cb-gray-900); margin: 0.5rem 0 1rem;">Access Forbidden</h1>
  <p style="color: var(--cb-gray-600); font-size: 0.9rem; margin-bottom: 1.5rem;">
    Your current session lacks the role-based privileges required to view or execute actions on this administrative resource.
  </p>
  <a href="{{ url_for('public.index') }}" class="btn btn-secondary">Return to Home</a>
</div>
{% endblock %}

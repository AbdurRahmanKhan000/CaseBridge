{% extends "base.html" %}
{% block title %}404 - Page Not Found | CaseBridge{% endblock %}
{% block content %}
<div class="card container-sm" style="text-align: center; margin: 3rem auto; padding: 3rem 2rem;">
  <span style="font-family: var(--cb-font-mono); font-size: 0.85rem; font-weight: 700; color: var(--cb-gray-500);">ERROR 404</span>
  <h1 style="font-size: 1.75rem; color: var(--cb-gray-900); margin: 0.5rem 0 1rem;">Resource Not Found</h1>
  <p style="color: var(--cb-gray-600); font-size: 0.9rem; margin-bottom: 1.5rem;">
    The page or case tracking record you requested could not be located. Verify the address or return to the main portal.
  </p>
  <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
